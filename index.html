<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Nuit au Musée de Cire — Fan Game (1 nuit)</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;}
  canvas{background:#000;box-shadow:0 0 60px #000;max-width:100vw;max-height:100vh;cursor:pointer;}
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<script>
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const HOUR_LEN = 50;          // secondes réelles par heure de jeu
const NIGHT_LEN = 6 * HOUR_LEN; // la nuit dure 5 minutes réelles
const MOVE_TICK = 4;          // une tentative de déplacement toutes les 4s

const ROOMS = {
  stage:     { cam: 'CAM 1', name: 'La Scène' },
  banquet:   { cam: 'CAM 2', name: 'Salle des Banquets' },
  couloirO:  { cam: 'CAM 3', name: 'Couloir Ouest', door: 'left' },
  couloirE:  { cam: 'CAM 4', name: 'Couloir Est',   door: 'right' },
  cuisine:   { cam: 'CAM 5', name: 'La Cuisine' },
  vestiaire: { cam: 'CAM 6', name: 'Les Vestiaires' },
  entree:    { cam: 'CAM 7', name: "L'Entrée" }
};
const ROOM_ORDER = ['stage', 'banquet', 'cuisine', 'vestiaire', 'entree', 'couloirO', 'couloirE'];

// Niveau d'agressivité (0-20) de chaque personnage, par heure de la nuit
const AI_BY_HOUR = [1, 3, 5, 8, 11, 14];

function makeChars() {
  return [
    { id: 'nap',  name: 'Napoléon',      emoji: '🎩', color: '#3b5bd6', pos: 'stage',     idx: 0, path: ['stage', 'banquet', 'couloirO'], side: 'left',  atDoor: false, doorT: 0, moveT: Math.random() * MOVE_TICK, stun: 0 },
    { id: 'cleo', name: 'Cléopâtre',     emoji: '👑', color: '#c9a227', pos: 'stage',     idx: 0, path: ['stage', 'entree', 'couloirE'],   side: 'right', atDoor: false, doorT: 0, moveT: Math.random() * MOVE_TICK, stun: 0 },
    { id: 'jea',  name: "Jeanne d'Arc",  emoji: '⚔️',        color: '#b03a3a', pos: 'cuisine',   idx: 0, path: ['cuisine', 'couloirE'],          side: 'right', atDoor: false, doorT: 0, moveT: Math.random() * MOVE_TICK, stun: 0 },
    { id: 'ein',  name: 'Einstein',      emoji: '🧑‍🔬', color: '#dddddd', pos: 'vestiaire', idx: 0, path: ['vestiaire'], random: true, side: 'left', atDoor: false, doorT: 0, moveT: Math.random() * MOVE_TICK, stun: 0 }
  ];
}

let G;
function reset() {
  G = {
    state: 'menu',          // menu | playing | jump | over | win
    elapsed: 0, power: 100,
    blackout: false, blackoutT: 0,
    doors:  { left:  { closed: false, pos: 0 }, right: { closed: false, pos: 0 } },
    lights: { left: false, right: false },
    camUp: false, camSel: 'stage',
    chars: makeChars(),
    jump: null, jumpT: 0, deathHour: '',
    hour: -1, fan: 0, btns: [],
    temp: 20,
    torch: { charges: 3, max: 3, rechargeT: 0 },
    torchFlash: { left: 0, right: 0 }
  };
}
reset();

// ---------- Audio (WebAudio, sons générés) ----------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + d);
  g.gain.setValueAtTime(vol || 0.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + d);
}
function noiseSnd(d, vol) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * d);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3000;
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start();
}
const sndDoor  = () => { tone(90, 0.18, 'square', 0.2, 50); noiseSnd(0.08, 0.1); };
const sndLight = () => tone(1400, 0.04, 'square', 0.06);
const sndCam   = () => tone(600, 0.07, 'square', 0.08, 900);
const sndBell  = () => { tone(880, 0.8, 'sine', 0.15); tone(1320, 0.5, 'sine', 0.06); };
const sndJump  = () => { noiseSnd(1.2, 0.5); tone(300, 1.1, 'sawtooth', 0.35, 40); tone(150, 1.1, 'square', 0.25, 30); };
const sndWin   = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.35, 'sine', 0.15), i * 180));

// ---------- Logique ----------
function hourNow() { return Math.min(5, Math.floor(G.elapsed / HOUR_LEN)); }
function hourLabel(h) { h = (h === undefined) ? hourNow() : h; return h === 0 ? '12 AM' : h + ' AM'; }

function toggleDoor(s)  { G.doors[s].closed = !G.doors[s].closed; sndDoor(); }
function toggleLight(s) { G.lights[s] = !G.lights[s]; sndLight(); }
function toggleCam()    { if (G.blackout) return; G.camUp = !G.camUp; sndCam(); }

// Mécanique originale : chalumeau à cire (renvoie une statue 2 salles en arrière + étourdissement)
function useTorch(side) {
  if (G.blackout || G.torch.charges <= 0) return;
  const c = G.chars.find(ch => ch.atDoor && ch.side === side);
  if (!c) return;
  G.torch.charges--;
  c.atDoor = false;
  c.stun = 10;
  if (c.random) c.pos = 'vestiaire';
  else { c.idx = Math.max(0, c.idx - 2); c.pos = c.path[c.idx]; }
  G.torchFlash[side] = 0.6;
  noiseSnd(0.5, 0.3);
  tone(220, 0.4, 'sawtooth', 0.2, 60);
}

function startBlackout() {
  G.blackout = true;
  G.blackoutT = 8 + Math.random() * 12;
  G.doors.left.closed = false;
  G.doors.right.closed = false;
  G.lights.left = G.lights.right = false;
  G.camUp = false;
  tone(60, 1.5, 'sawtooth', 0.2, 30);
}

function doJumpscare(c) {
  G.state = 'jump';
  G.jump = c;
  G.jumpT = 0;
  G.deathHour = hourLabel();
  sndJump();
}

function winGame() {
  G.state = 'win';
  sndWin();
}

function update(dt) {
  if (G.state !== 'playing' && G.state !== 'jump') return;
  G.fan += dt * 8;

  if (G.state === 'jump') {
    G.jumpT += dt;
    if (G.jumpT > 1.4) G.state = 'over';
    return;
  }

  G.elapsed += dt;
  const hour = hourNow();
  if (hour !== G.hour) { G.hour = hour; sndBell(); }
  if (G.elapsed >= NIGHT_LEN) { winGame(); return; }

  if (G.torch.charges < G.torch.max) {
    G.torch.rechargeT += dt;
    if (G.torch.rechargeT >= 40) { G.torch.charges++; G.torch.rechargeT = 0; }
  }
  G.torchFlash.left = Math.max(0, G.torchFlash.left - dt);
  G.torchFlash.right = Math.max(0, G.torchFlash.right - dt);
  // Mécanique originale : la chaleur ralentit la cire (mouvement + attente à la porte)
  const tickLen = MOVE_TICK * (1 + G.temp / 40);

  if (!G.blackout) {
    let drain = 0.055 + G.temp * 0.0015;
    if (G.doors.left.closed)  drain += 0.05;
    if (G.doors.right.closed) drain += 0.05;
    if (G.lights.left)  drain += 0.03;
    if (G.lights.right) drain += 0.03;
    if (G.camUp) drain += 0.03;
    G.power = Math.max(0, G.power - drain * dt);
    if (G.power <= 0) startBlackout();
  } else {
    G.blackoutT -= dt;
    if (G.blackoutT <= 0) {
      doJumpscare(G.chars[Math.floor(Math.random() * G.chars.length)]);
      return;
    }
  }

  for (const s of ['left', 'right']) {
    const d = G.doors[s];
    const target = d.closed ? 1 : 0;
    d.pos += (target - d.pos) * Math.min(1, dt * 12);
  }

  const ai = AI_BY_HOUR[hour];
  for (const c of G.chars) {
    if (c.atDoor) {
      c.doorT -= dt;
      if (c.doorT <= 0) {
        if (G.doors[c.side].closed) {
          c.atDoor = false;
          if (c.random) { c.pos = 'vestiaire'; }
          else { c.idx = Math.max(0, c.idx - 1); c.pos = c.path[c.idx]; }
          c.moveT = Math.random() * MOVE_TICK;
        } else {
          doJumpscare(c);
          return;
        }
      }
    } else if (c.stun > 0) {
      c.stun -= dt;
    } else {
      c.moveT += dt;
      if (c.moveT >= tickLen) {
        c.moveT = 0;
        if (Math.random() * 20 < ai) {
          const n = c.random ? (Math.random() < 0.5 ? 'couloirO' : 'couloirE') : c.path[c.idx + 1];
          if (n) {
            if (!c.random) c.idx++;
            c.pos = n;
            const r = ROOMS[n];
            if (r.door) {
              c.atDoor = true;
              c.side = r.door;
              c.doorT = (3 + Math.random() * 5) * (1 + G.temp / 80);
            }
          }
        }
      }
    }
  }
}

// ---------- Entrées ----------
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('click', (e) => {
  audio();
  const p = canvasPos(e);
  for (const b of G.btns) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { press(b.id); return; }
  }
});
window.addEventListener('keydown', (e) => {
  if (G.state !== 'playing') return;
  const k = e.key.toLowerCase();
  if (k === 'a') toggleDoor('left');
  else if (k === 'z') { if (!G.blackout) toggleLight('left'); }
  else if (k === 'e') { if (!G.blackout) toggleLight('right'); }
  else if (k === 'd') toggleDoor('right');
  else if (k === 'r') press('tempUp');
  else if (k === 'f') press('tempDown');
  else if (k === 'x') press('torchL');
  else if (k === 'v') press('torchR');
  else if (k === 'c' || k === ' ') toggleCam();
  else if (G.camUp && k >= '1' && k <= '7') { const i = +k - 1; if (i < ROOM_ORDER.length) { G.camSel = ROOM_ORDER[i]; sndCam(); } }
});

function press(id) {
  if (G.state === 'menu') {
    if (id === 'start') { G.state = 'playing'; G.hour = 0; sndBell(); }
    return;
  }
  if (G.state === 'over' || G.state === 'win') {
    if (id === 'retry') { reset(); G.state = 'playing'; G.hour = 0; }
    return;
  }
  if (G.state !== 'playing') return;
  switch (id) {
    case 'doorL':  if (!G.blackout) toggleDoor('left');  break;
    case 'doorR':  if (!G.blackout) toggleDoor('right'); break;
    case 'lightL': if (!G.blackout) toggleLight('left');  break;
    case 'lightR': if (!G.blackout) toggleLight('right'); break;
    case 'cam':    toggleCam(); break;
    case 'camDown': toggleCam(); break;
    case 'torchL': useTorch('left'); break;
    case 'torchR': useTorch('right'); break;
    case 'tempUp':   G.temp = Math.min(100, G.temp + 10); tone(500, 0.05, 'square', 0.06, 700); break;
    case 'tempDown': G.temp = Math.max(0, G.temp - 10);  tone(500, 0.05, 'square', 0.06, 300); break;
    default:
      if (id.startsWith('cam:')) { G.camSel = id.slice(4); sndCam(); }
  }
}

// ---------- Rendu ----------
function button(x, y, w, h, label, id, active, sub) {
  G.btns.push({ x, y, w, h, id });
  ctx.fillStyle = active ? '#2e7d4f' : '#1c2333';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = active ? '#7dffb0' : '#4a5878';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = active ? '#eafff2' : '#cfd8ea';
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 - (sub ? 6 : -4));
  if (sub) {
    ctx.font = '11px monospace';
    ctx.fillStyle = '#8fa0c0';
    ctx.fillText('[' + sub + ']', x + w / 2, y + h / 2 + 13);
  }
}

function drawHUD() {
  ctx.textAlign = 'left';
  ctx.font = 'bold 18px monospace';
  const p = Math.ceil(G.power);
  ctx.fillStyle = p > 50 ? '#7dff9a' : p > 20 ? '#ffc857' : '#ff5a5a';
  ctx.fillText('⚡ ' + p + '%', 20, 32);
  ctx.fillStyle = '#334';
  ctx.fillRect(110, 18, 150, 14);
  ctx.fillStyle = p > 50 ? '#2e7d4f' : p > 20 ? '#b8860b' : '#a02020';
  ctx.fillRect(110, 18, 150 * (G.power / 100), 14);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#e8ecf5';
  ctx.fillText(hourLabel() + '  ⏰', W - 20, 32);
}

function drawDoorway(side) {
  const x = side === 'left' ? 0 : W - 110;
  const d = G.doors[side];
  ctx.fillStyle = '#000';
  ctx.fillRect(x, 60, 110, 400);
  ctx.strokeStyle = '#4a4f5e';
  ctx.lineWidth = 6;
  ctx.strokeRect(x, 60, 110, 400);

  if (!G.blackout && G.lights[side]) {
    const gr = ctx.createRadialGradient(x + 55, 260, 10, x + 55, 260, 150);
    gr.addColorStop(0, 'rgba(255,240,180,0.35)');
    gr.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(x - 50, 60, 210, 400);
    const c = G.chars.find(ch => ch.atDoor && ch.side === side);
    if (c) {
      ctx.font = '64px serif';
      ctx.textAlign = 'center';
      ctx.fillText(c.emoji, x + 55, 300);
      ctx.fillStyle = c.color;
      ctx.font = 'bold 13px monospace';
      ctx.fillText(c.name, x + 55, 330);
    }
  }

  const ph = 400 * d.pos;
  if (ph > 1) {
    const g = ctx.createLinearGradient(x, 0, x + 110, 0);
    g.addColorStop(0, '#5a6070'); g.addColorStop(0.5, '#8a92a5'); g.addColorStop(1, '#4a505e');
    ctx.fillStyle = g;
    ctx.fillRect(x, 60, 110, ph);
    ctx.strokeStyle = '#2c303a';
    ctx.lineWidth = 2;
    for (let yy = 80; yy < 60 + ph; yy += 40) {
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + 110, yy); ctx.stroke();
    }
  }

  if (G.torchFlash[side] > 0) {
    const a = G.torchFlash[side] / 0.6;
    const fg = ctx.createRadialGradient(x + 55, 260, 10, x + 55, 260, 170);
    fg.addColorStop(0, 'rgba(255,150,30,' + (0.75 * a) + ')');
    fg.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(x - 60, 60, 230, 400);
  }
}

function drawOffice() {
  G.btns = [];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1d29'); g.addColorStop(0.7, '#23283a'); g.addColorStop(1, '#141722');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#0d0f16';
  ctx.fillRect(0, 430, W, 90);
  ctx.strokeStyle = '#1c2030';
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 430); ctx.lineTo(x - 30, 520); ctx.stroke(); }

  ctx.fillStyle = '#2e2a1f';
  ctx.fillRect(380, 60, 200, 110);
  ctx.strokeStyle = '#54492c';
  ctx.strokeRect(380, 60, 200, 110);
  ctx.fillStyle = '#e8d9a0';
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('MUSÉE DE CIRE', 480, 90);
  ctx.font = '12px monospace';
  ctx.fillText('— NUIT DE GARDE —', 480, 110);
  ctx.fillText('12h → 6h', 480, 132);
  ctx.fillText('Ne les laisse pas entrer !', 480, 152);

  drawDoorway('left');
  drawDoorway('right');

  ctx.fillStyle = '#3a2f22';
  ctx.fillRect(330, 470, 300, 50);
  ctx.fillStyle = '#241d13';
  ctx.fillRect(345, 450, 90, 25);
  ctx.fillStyle = '#0f2a18';
  ctx.fillRect(350, 455, 80, 15);
  ctx.fillStyle = '#39d353';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('GARDE-01 online', 353, 465);

  ctx.save();
  ctx.translate(480, 495);
  ctx.rotate(G.fan);
  ctx.fillStyle = '#888a95';
  for (let i = 0; i < 3; i++) {
    ctx.rotate(Math.PI * 2 / 3);
    ctx.beginPath(); ctx.ellipse(0, -13, 8, 17, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#aaa';
  ctx.beginPath(); ctx.arc(480, 495, 5, 0, Math.PI * 2); ctx.fill();

  if (G.temp > 0 && !G.blackout) {
    ctx.fillStyle = 'rgba(255,110,20,' + (G.temp / 100 * 0.12) + ')';
    ctx.fillRect(0, 0, W, 512);
  }

  if (G.blackout) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, 520);
    if (Math.random() < 0.5) {
      ctx.globalAlpha = 0.5;
      ctx.font = '70px serif';
      ctx.textAlign = 'center';
      ctx.fillText(G.chars[0].emoji, 55, 320);
      ctx.globalAlpha = 1;
    }
  }

  drawHUD();

  ctx.fillStyle = '#0a0c12';
  ctx.fillRect(0, 512, W, 88);
  button(20, 520, 120, 40, 'PORTE G', 'doorL', G.doors.left.closed, 'A');
  button(155, 520, 120, 40, 'LUMIÈRE G', 'lightL', G.lights.left && !G.blackout, 'Z');
  button(380, 516, 200, 48, '📹 CAMÉRAS', 'cam', G.camUp, 'C');
  button(685, 520, 120, 40, 'LUMIÈRE D', 'lightR', G.lights.right && !G.blackout, 'E');
  button(820, 520, 120, 40, 'PORTE D', 'doorR', G.doors.right.closed, 'D');

  const torchReady = G.torch.charges > 0 && !G.blackout;
  button(20, 566, 120, 30, '🔥 CIRE G', 'torchL', torchReady, 'X');
  button(155, 566, 55, 30, '−', 'tempDown', false, 'F');
  G.btns.push({ x: 220, y: 566, w: 125, h: 30, id: 'tempInfo' });
  ctx.fillStyle = '#10141f'; ctx.fillRect(220, 566, 125, 30);
  ctx.strokeStyle = '#4a5878'; ctx.lineWidth = 2; ctx.strokeRect(220, 566, 125, 30);
  ctx.fillStyle = G.temp >= 70 ? '#ff9a5a' : '#cfd8ea';
  ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('🌡️ ' + G.temp + '°C', 282, 586);
  button(355, 566, 55, 30, '+', 'tempUp', false, 'R');
  G.btns.push({ x: 420, y: 566, w: 130, h: 30, id: 'torchInfo' });
  ctx.fillStyle = '#10141f'; ctx.fillRect(420, 566, 130, 30);
  ctx.strokeStyle = '#4a5878'; ctx.strokeRect(420, 566, 130, 30);
  ctx.fillStyle = torchReady ? '#ffb14a' : '#666a75';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('🔥 cire x' + G.torch.charges + '/' + G.torch.max, 485, 586);
  ctx.fillStyle = '#8fa0c0'; ctx.font = '11px monospace';
  ctx.fillText('chauffage : ralentit la cire, mais vide ⚡', 560, 586);
  button(800, 566, 140, 30, '🔥 CIRE D', 'torchR', torchReady, 'V');
}

function drawCam() {
  G.btns = [];
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.font = 'bold 18px monospace';
  ctx.fillStyle = '#39d353';
  ctx.fillText('● REC  SURVEILLANCE', 20, 32);
  drawHUD();

  let y = 55;
  for (const key of ROOM_ORDER) {
    const r = ROOMS[key];
    const has = G.chars.some(c => (c.pos === key && !c.atDoor) || (c.atDoor && r.door === c.side));
    button(20, y, 235, 52, r.cam + ' — ' + r.name, 'cam:' + key, G.camSel === key, '');
    if (has) {
      ctx.fillStyle = Math.floor(performance.now() / 300) % 2 === 0 ? '#ff4040' : '#801515';
      ctx.beginPath(); ctx.arc(243, y + 26, 7, 0, Math.PI * 2); ctx.fill();
    }
    y += 60;
  }
  ctx.fillStyle = '#5a7a5a';
  ctx.font = '11px monospace';
  ctx.fillText('Touches 1-7 : changer de caméra', 20, y + 10);

  const fx = 275, fy = 55, fw = W - fx - 20, fh = H - 145;
  ctx.fillStyle = '#000';
  ctx.fillRect(fx, fy, fw, fh);
  ctx.strokeStyle = '#2a4a2a';
  ctx.lineWidth = 3;
  ctx.strokeRect(fx, fy, fw, fh);

  ctx.fillStyle = '#39d353';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('> ' + ROOMS[G.camSel].cam + ' : ' + ROOMS[G.camSel].name.toUpperCase(), fx + 12, fy + 28);

  const here = G.chars.filter(c => (c.pos === G.camSel && !c.atDoor) || (c.atDoor && ROOMS[G.camSel].door === c.side));
  if (here.length === 0) {
    ctx.fillStyle = '#1e5c2a';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('... signal vide ...', fx + fw / 2, fy + fh / 2);
  } else {
    here.forEach((c, i) => {
      const cx = fx + fw / 2 + (i - (here.length - 1) / 2) * 130;
      ctx.font = '72px serif';
      ctx.textAlign = 'center';
      ctx.fillText(c.emoji, cx, fy + fh / 2 + 10);
      ctx.fillStyle = c.color;
      ctx.font = 'bold 14px monospace';
      ctx.fillText(c.name, cx, fy + fh / 2 + 55);
    });
  }

  for (let i = 0; i < 300; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.07) + ')';
    ctx.fillRect(fx + Math.random() * fw, fy + Math.random() * fh, 2, 2);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let yy = fy; yy < fy + fh; yy += 4) ctx.fillRect(fx, yy, fw, 2);

  button(fx, fy + fh + 18, 220, 45, '▼ FERMER CAMÉRAS', 'camDown', false, 'C');
}

function drawMenu() {
  G.btns = [];
  ctx.fillStyle = '#07080e';
  ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, 520);
  v.addColorStop(0, 'rgba(60,50,90,0.5)');
  v.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8d9a0';
  ctx.font = 'bold 40px monospace';
  ctx.fillText('LA NUIT AU MUSÉE DE CIRE', W / 2, 70);
  ctx.fillStyle = '#9aa5c0';
  ctx.font = '15px monospace';
  ctx.fillText('Un fan game en UNE seule nuit : survive de 12 AM à 6 AM.', W / 2, 100);
  ctx.fillText("Tu es le gardien de nuit. Les statues de cire... ne dorment pas.", W / 2, 122);

  ctx.font = '16px monospace';
  ctx.fillStyle = '#cfd8ea';
  const roster = [
    ['🎩', 'Napoléon', 'rapide, attaque par la porte GAUCHE'],
    ['👑', 'Cléopâtre', "passe par l'entrée, porte DROITE"],
    ['⚔️', "Jeanne d'Arc", 'surgit de la cuisine, porte DROITE'],
    ['🧑‍🔬', 'Einstein', 'imprévisible : les DEUX côtés']
  ];
  let y = 165;
  for (const [e, n, d] of roster) {
    ctx.font = '26px serif';
    ctx.textAlign = 'left';
    ctx.fillText(e, 250, y);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(n, 300, y);
    ctx.fillStyle = '#9aa5c0';
    ctx.font = '13px monospace';
    ctx.fillText('— ' + d, 300, y + 18);
    y += 46;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8fa0c0';
  ctx.font = '13px monospace';
  ctx.fillText('A/Z/E/D : portes & lumières · C : caméras (1-7) · R/F : chauffage · X/V : chalumeau à cire · (ou clic souris)', W / 2, y + 20);
  ctx.fillText('Surveille les CAM, ferme la bonne porte, vérifie avec la LUMIÈRE. Gère ta batterie ⚡ : à 0%, tout s\'éteint...', W / 2, y + 42);
  ctx.fillStyle = '#ffb14a';
  ctx.fillText('🌡️ MÉCANIQUE ORIGINALE — CHAUFFAGE (R/F) : plus il fait chaud, plus la cire est lente... mais la batterie fond vite.', W / 2, y + 64);
  ctx.fillText('🔥 MÉCANIQUE ORIGINALE — CHALUMEAU (X/V) : charges limitées, renvoie une statue 2 salles en arrière et l\'étourdit 10s.', W / 2, y + 86);

  button(W / 2 - 130, y + 108, 260, 55, '▶ COMMENCER LA NUIT', 'start', false, '');

  ctx.fillStyle = '#556';
  ctx.font = '11px monospace';
  ctx.fillText('Fan game non affilié à FNAF / Five Nights at Freddy\'s. Personnages historiques originaux.', W / 2, H - 14);
}

function drawJump() {
  G.btns = [];
  ctx.fillStyle = Math.floor(G.jumpT * 20) % 2 === 0 ? '#7a0000' : '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '260px serif';
  ctx.fillText(G.jump.emoji, W / 2 + (Math.random() * 40 - 20), H / 2 + 60 + (Math.random() * 40 - 20));
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 42px monospace';
  ctx.fillText(G.jump.name.toUpperCase() + ' !', W / 2, H - 60);
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.25) + ')';
    ctx.fillRect(Math.random() * W, Math.random() * H, 3, 3);
  }
}

function drawOver(win) {
  G.btns = [];
  ctx.fillStyle = '#07080e';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (win) {
    ctx.fillStyle = '#7dff9a';
    ctx.font = 'bold 64px monospace';
    ctx.fillText('6:00 AM', W / 2, 200);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('🎉 Tu as survécu à la nuit ! 🎉', W / 2, 260);
    ctx.fillStyle = '#9aa5c0';
    ctx.font = '16px monospace';
    ctx.fillText('Batterie restante : ' + Math.ceil(G.power) + '%', W / 2, 300);
  } else {
    ctx.fillStyle = '#ff4040';
    ctx.font = 'bold 64px monospace';
    ctx.fillText('GAME OVER', W / 2, 200);
    ctx.fillStyle = '#e8ecf5';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(G.jump ? G.jump.name + ' t\'a eu à ' + G.deathHour : 'Tu as tenu jusqu\'à ' + G.deathHour, W / 2, 260);
  }
  button(W / 2 - 110, 340, 220, 55, '↻ REJOUER', 'retry', false, '');
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (G.state === 'menu') drawMenu();
  else if (G.state === 'playing') { if (G.camUp) drawCam(); else drawOffice(); }
  else if (G.state === 'jump') drawJump();
  else if (G.state === 'over') drawOver(false);
  else if (G.state === 'win') drawOver(true);
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
